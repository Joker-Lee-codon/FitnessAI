<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">FitnessAI Direction B — Set Blocks</title>
  <desc id="desc">Apple Watch Active Session and iPhone Today and Plans representative visual direction.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#211D17" flood-opacity=".18"/></filter>
    <style>
      .sf{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif}.rounded{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.mono{font-variant-numeric:tabular-nums}.caps{letter-spacing:4px}.ink{fill:#171713}.muted{fill:#6E6A61}.blue{fill:#3156D9}.tiny{font-size:16px}.small{font-size:20px}.body{font-size:24px}.heading{font-size:42px;font-weight:750}.display{font-size:82px;font-weight:800}
    </style>
  </defs>
  <rect width="1800" height="1800" fill="#EDE8DD"/>
  <path d="M0 0H1800V170C1420 224 1120 124 760 180C420 234 160 198 0 152Z" fill="#F7F3EA"/>
  <text x="86" y="84" class="sf blue tiny caps">FITNESSAI · ND-01 · DIRECTION B</text>
  <text x="86" y="148" class="rounded ink" font-size="58" font-weight="800">训练组块 <tspan class="muted" font-size="24" font-weight="600">SET BLOCKS</tspan></text>
  <text x="86" y="192" class="sf muted body">把训练组装成醒目、有限的块。现在、下一步与已保存一眼分开。</text>
  <line x1="86" y1="232" x2="1714" y2="232" stroke="#C9C1B3" stroke-width="2"/>

  <text x="238" y="286" class="sf muted tiny caps">APPLE WATCH · ACTIVE SESSION</text>
  <g filter="url(#shadow)">
    <rect x="170" y="318" width="440" height="530" rx="116" fill="#171713"/>
    <rect x="188" y="336" width="404" height="494" rx="98" fill="#F7F3EA"/>
    <text x="226" y="398" class="sf muted tiny">计划训练 · 第 3 / 4 组</text>
    <text x="226" y="452" class="rounded ink heading">杠铃卧推</text>
    <path d="M218 486H548V652H218Z" fill="#1C1C18"/>
    <path d="M430 486H548V652H430Z" fill="#DCD4C4"/>
    <text x="250" y="578" class="rounded" font-size="76" font-weight="800" fill="#F7F3EA">80<tspan font-size="23"> kg</tspan></text>
    <text x="250" y="620" class="sf" font-size="18" fill="#BEB9AE">实际负重</text>
    <text x="489" y="572" class="rounded ink" font-size="58" font-weight="800" text-anchor="middle">8</text>
    <text x="489" y="612" class="sf muted tiny" text-anchor="middle">次</text>
    <rect x="218" y="652" width="330" height="46" fill="#C8D2B3"/>
    <text x="238" y="681" class="sf ink tiny">✓ 已保存到本机 · 上一组负重</text>
    <rect x="218" y="718" width="330" height="74" rx="18" fill="#3156D9"/>
    <text x="383" y="765" class="sf" font-size="22" font-weight="750" text-anchor="middle" fill="#FFF">完成本组  →</text>
  </g>

  <text x="874" y="286" class="sf muted tiny caps">IPHONE · TODAY &amp; PLANS</text>
  <g filter="url(#shadow)">
    <rect x="810" y="310" width="520" height="742" rx="76" fill="#171713"/>
    <rect x="828" y="328" width="484" height="706" rx="60" fill="#F7F3EA"/>
    <rect x="982" y="340" width="176" height="30" rx="15" fill="#171713"/>
    <text x="870" y="414" class="sf muted tiny caps">今天训练 · 7 月 21 日</text>
    <text x="870" y="468" class="rounded ink" font-size="50" font-weight="800">上肢力量</text>
    <text x="870" y="502" class="sf muted small">5 个动作 · 18 组 · 约 68 分钟</text>
    <rect x="870" y="536" width="400" height="76" rx="18" fill="#3156D9"/>
    <text x="900" y="569" class="sf" font-size="16" fill="#DDE4FF">WATCH 已就绪</text>
    <text x="900" y="594" class="sf" font-size="22" font-weight="750" fill="#FFF">在 Watch 上开始  →</text>
    <g>
      <path d="M870 638H1270V730H870Z" fill="#171713"/>
      <text x="892" y="691" class="rounded" font-size="44" font-weight="800" fill="#F7F3EA">01</text>
      <text x="966" y="676" class="sf" font-size="24" font-weight="700" fill="#F7F3EA">杠铃卧推</text>
      <text x="966" y="708" class="sf" font-size="16" fill="#BEB9AE">4 组 × 8 次 · 80 kg · RPE 8</text>
      <path d="M870 730H1270V822H870Z" fill="#DCD4C4"/>
      <text x="892" y="783" class="rounded ink" font-size="44" font-weight="800">02</text>
      <text x="966" y="768" class="sf ink" font-size="24" font-weight="700">上斜哑铃卧推</text>
      <text x="966" y="800" class="sf muted tiny">3 组 × 10 次 · 26 kg · RPE 8</text>
      <path d="M870 822H1270V914H870Z" fill="#C8D2B3"/>
      <path d="M870 822H878V914H870Z" fill="#D5573B"/>
      <text x="892" y="875" class="rounded ink" font-size="44" font-weight="800">03</text>
      <text x="966" y="860" class="sf ink" font-size="24" font-weight="700">坐姿推肩</text>
      <text x="966" y="892" class="sf muted tiny">3 组 × 8 次 · 42.5 kg · 器械待确认</text>
    </g>
    <line x1="858" y1="954" x2="1282" y2="954" stroke="#C9C1B3" stroke-width="2"/>
    <text x="910" y="998" class="sf blue tiny" text-anchor="middle">今天</text>
    <text x="1070" y="998" class="sf muted tiny" text-anchor="middle">历史</text>
    <text x="1230" y="998" class="sf muted tiny" text-anchor="middle">分析</text>
  </g>

  <g transform="translate(1420 350)">
    <text x="0" y="0" class="sf muted tiny caps">STRUCTURAL IDEA</text>
    <text x="0" y="52" class="rounded ink heading">有限组块</text>
    <text x="0" y="88" class="sf muted small">Watch：非对称分割</text>
    <text x="0" y="120" class="sf muted small">iPhone：相连动作带</text>
    <line x1="0" y1="160" x2="290" y2="160" stroke="#C9C1B3" stroke-width="2"/>
    <text x="0" y="210" class="sf blue tiny caps">POSTURE</text>
    <text x="0" y="248" class="sf ink small">直接 · 触觉化 · 具体</text>
    <text x="0" y="288" class="sf muted tiny">暖粉笔 / 近黑墨 / 钴蓝</text>
    <text x="0" y="318" class="sf muted tiny">饱和色只属于操作与状态边</text>
    <line x1="0" y1="360" x2="290" y2="360" stroke="#C9C1B3" stroke-width="2"/>
    <text x="0" y="410" class="sf muted tiny caps">GUARDRAIL</text>
    <text x="0" y="448" class="sf ink small">信息块不等于按钮</text>
    <text x="0" y="480" class="sf muted tiny">仅原生控件具有交互 traits；</text>
    <text x="0" y="508" class="sf muted tiny">状态始终配有字面说明。</text>
  </g>
  <text x="86" y="1080" class="sf muted tiny">Representative preview only · SwiftUI native behavior, Dynamic Type and state contracts remain authoritative.</text>
</svg>

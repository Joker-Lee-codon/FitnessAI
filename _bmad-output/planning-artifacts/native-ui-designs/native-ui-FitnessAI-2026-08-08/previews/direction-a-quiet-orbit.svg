<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">FitnessAI Direction A — Quiet Orbit</title>
  <desc id="desc">Apple Watch Active Session and iPhone Today and Plans representative visual direction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09100F"/><stop offset="1" stop-color="#10131A"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8BFFD8"/><stop offset="1" stop-color="#43DDB5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".42"/></filter>
    <style>
      .sf{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif}.mono{font-variant-numeric:tabular-nums}.caps{letter-spacing:4px}.muted{fill:#889791}.bone{fill:#F2EEE3}.mint{fill:#76F4CC}.line{stroke:#2C3A37;stroke-width:2}.tiny{font-size:16px}.small{font-size:20px}.body{font-size:24px}.heading{font-size:42px;font-weight:700}.display{font-size:94px;font-weight:750}
    </style>
  </defs>
  <rect width="1800" height="1800" fill="url(#bg)"/>
  <circle cx="1590" cy="90" r="180" fill="#43DDB5" opacity=".035"/>
  <text x="86" y="84" class="sf mint tiny caps">FITNESSAI · ND-01 · DIRECTION A</text>
  <text x="86" y="148" class="sf bone" font-size="58" font-weight="750">静域轨道 <tspan class="muted" font-size="24" font-weight="500">QUIET ORBIT</tspan></text>
  <text x="86" y="192" class="sf muted body">一个事实位于安静的轨道场中。训练时界面后退，真相始终清楚。</text>
  <line x1="86" y1="232" x2="1714" y2="232" class="line"/>

  <text x="238" y="286" class="sf muted tiny caps">APPLE WATCH · ACTIVE SESSION</text>
  <g filter="url(#shadow)">
    <rect x="170" y="318" width="440" height="530" rx="116" fill="#050807" stroke="#46534F" stroke-width="8"/>
    <rect x="188" y="336" width="404" height="494" rx="98" fill="#070B0A"/>
    <path d="M244 680 A155 155 0 1 1 542 680" fill="none" stroke="#24312E" stroke-width="13" stroke-linecap="round" stroke-dasharray="90 15"/>
    <path d="M244 680 A155 155 0 0 1 475 425" fill="none" stroke="url(#mint)" stroke-width="13" stroke-linecap="round" stroke-dasharray="90 15"/>
    <text x="238" y="402" class="sf muted tiny">计划训练</text>
    <text x="534" y="402" class="sf mint tiny" text-anchor="end">第 3 / 4 组</text>
    <text x="238" y="454" class="sf bone heading">杠铃卧推</text>
    <text x="390" y="574" class="sf bone display mono" text-anchor="middle">80<tspan font-size="25" class="mint"> kg</tspan></text>
    <text x="390" y="622" class="sf muted body mono" text-anchor="middle">8 次 · 实际负重</text>
    <rect x="274" y="666" width="232" height="30" rx="15" fill="#0E1815"/>
    <circle cx="292" cy="681" r="5" fill="#76F4CC"/>
    <text x="310" y="687" class="sf mint tiny">已保存到本机</text>
    <rect x="226" y="736" width="328" height="66" rx="33" fill="url(#mint)"/>
    <text x="390" y="778" class="sf" font-size="22" font-weight="700" text-anchor="middle" fill="#06251D">完成本组</text>
  </g>

  <text x="874" y="286" class="sf muted tiny caps">IPHONE · TODAY &amp; PLANS</text>
  <g filter="url(#shadow)">
    <rect x="810" y="310" width="520" height="742" rx="76" fill="#030605" stroke="#45514E" stroke-width="8"/>
    <rect x="828" y="328" width="484" height="706" rx="60" fill="#070B0A"/>
    <rect x="982" y="340" width="176" height="30" rx="15" fill="#020303"/>
    <text x="872" y="410" class="sf mint tiny caps">7 月 21 日 · 周二</text>
    <text x="872" y="464" class="sf bone" font-size="50" font-weight="750">今天，练上肢。</text>
    <text x="872" y="500" class="sf muted small">上肢力量 · 5 个动作 · 约 68 分钟</text>
    <line x1="906" y1="550" x2="906" y2="880" stroke="#32413D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="906" cy="576" r="15" fill="#76F4CC"/>
    <circle cx="906" cy="680" r="11" fill="#101B18" stroke="#76F4CC" stroke-width="4"/>
    <circle cx="906" cy="760" r="11" fill="#101B18" stroke="#697872" stroke-width="4"/>
    <circle cx="906" cy="840" r="11" fill="#101B18" stroke="#697872" stroke-width="4"/>
    <text x="950" y="566" class="sf bone" font-size="30" font-weight="700">上肢力量</text>
    <text x="950" y="596" class="sf muted tiny">训练计划 03 · 已缓存到本机</text>
    <rect x="948" y="622" width="308" height="58" rx="29" fill="url(#mint)"/>
    <text x="1102" y="659" class="sf" font-size="20" font-weight="700" text-anchor="middle" fill="#06251D">在 Watch 上开始  ↗</text>
    <text x="950" y="676" class="sf mint tiny">Watch 已就绪</text>
    <text x="950" y="700" class="sf bone body" font-weight="650">01  杠铃卧推</text>
    <text x="950" y="730" class="sf muted tiny mono">4 组 × 8 次 · 目标 80 kg</text>
    <text x="950" y="780" class="sf bone body" font-weight="650">02  上斜哑铃卧推</text>
    <text x="950" y="810" class="sf muted tiny mono">3 组 × 10 次 · 目标 26 kg</text>
    <text x="950" y="860" class="sf bone body" font-weight="650">03  坐姿推肩</text>
    <text x="950" y="890" class="sf muted tiny mono">3 组 × 8 次 · 目标 42.5 kg</text>
    <line x1="860" y1="954" x2="1280" y2="954" class="line"/>
    <text x="910" y="998" class="sf mint tiny" text-anchor="middle">今天</text>
    <text x="1070" y="998" class="sf muted tiny" text-anchor="middle">历史</text>
    <text x="1230" y="998" class="sf muted tiny" text-anchor="middle">分析</text>
  </g>

  <g transform="translate(1420 350)">
    <text x="0" y="0" class="sf muted tiny caps">STRUCTURAL IDEA</text>
    <text x="0" y="52" class="sf bone heading">中心事实</text>
    <text x="0" y="88" class="sf muted small">Watch：离散轨道</text>
    <text x="0" y="120" class="sf muted small">iPhone：连续跑道</text>
    <line x1="0" y1="160" x2="290" y2="160" class="line"/>
    <text x="0" y="210" class="sf mint tiny caps">POSTURE</text>
    <text x="0" y="248" class="sf bone small">安静 · 聚焦 · 具有氛围</text>
    <text x="0" y="288" class="sf muted tiny">OLED 石墨 / 暖骨白</text>
    <text x="0" y="318" class="sf muted tiny">电光薄荷只标记行动与提交</text>
    <line x1="0" y1="360" x2="290" y2="360" class="line"/>
    <text x="0" y="410" class="sf muted tiny caps">GUARDRAIL</text>
    <text x="0" y="448" class="sf bone small">轨道只表示离散组进度</text>
    <text x="0" y="480" class="sf muted tiny">不暗示心率、卡路里或</text>
    <text x="0" y="508" class="sf muted tiny">自动动作质量。</text>
  </g>
  <text x="86" y="1080" class="sf muted tiny">Representative preview only · SwiftUI native behavior, Dynamic Type and state contracts remain authoritative.</text>
</svg>

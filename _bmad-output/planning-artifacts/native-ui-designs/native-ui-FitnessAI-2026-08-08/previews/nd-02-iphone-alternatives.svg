    <rect x="372" y="372" width="120" height="34" rx="17" fill="#000"/>
    <circle cx="590" cy="394" r="5" fill="#F5F1E8"/><rect x="602" y="389" width="16" height="10" rx="3" fill="#F5F1E8"/>

    <text x="268" y="448" class="sf red" font-size="14" font-weight="700">今天训练 · 7 月 21 日</text>
    <text x="268" y="498" class="rounded paper" font-size="48" font-weight="820">上肢力量</text>
    <text x="268" y="528" class="sf muted" font-size="17">计划 03 · 5 个动作 · 约 68 分钟</text>

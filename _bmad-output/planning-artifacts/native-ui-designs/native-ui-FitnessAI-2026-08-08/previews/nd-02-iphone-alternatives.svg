    <text x="268" y="626" class="rounded red" font-size="50" font-weight="820">01</text>
    <text x="348" y="612" class="sf paper" font-size="24" font-weight="720">杠铃卧推</text>
    <text x="348" y="642" class="sf muted" font-size="15">4 × 8 · 80 kg · RPE 8</text>

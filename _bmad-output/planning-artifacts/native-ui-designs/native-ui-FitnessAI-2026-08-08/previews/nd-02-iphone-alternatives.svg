    <text x="922" y="878" class="sf paper" font-size="22" font-weight="720">上斜哑铃卧推</text><text x="1228" y="878" class="sf muted" font-size="14" text-anchor="end">3 × 10 · 26 kg</text>
    <text x="922" y="950" class="sf paper" font-size="22" font-weight="720">坐姿推肩</text><text x="1228" y="950" class="sf pending" font-size="14" text-anchor="end">器械待确认</text>
    <text x="922" y="1000" class="sf muted" font-size="15">另有 2 个动作　查看完整计划 ›</text>


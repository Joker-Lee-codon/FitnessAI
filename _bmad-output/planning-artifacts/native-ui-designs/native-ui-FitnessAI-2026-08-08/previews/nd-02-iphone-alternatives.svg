<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">FitnessAI ND-02 iPhone Today and Plans Alternatives</title>
  <desc id="desc">Two portrait iPhone alternatives within the selected Kinetic Type system; Apple Watch design remains unchanged.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".42"/></filter>
    <style>.sf{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif}.rounded{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.mono{font-variant-numeric:tabular-nums}.paper{fill:#F5F1E8}.muted{fill:#B8B4AC}.red{fill:#FF5B3F}.peri{fill:#A7AEFF}.durable{fill:#64C79B}.pending{fill:#F3BD4F}.tiny{font-size:15px}.small{font-size:19px}.body{font-size:23px}.heading{font-size:42px;font-weight:760}</style>
  </defs>
  <rect width="1800" height="1800" fill="#0B0B0D"/>
  <text x="82" y="78" class="sf red tiny" letter-spacing="3">FITNESSAI · ND-02 · IPHONE COMPOSITION</text>
  <text x="82" y="142" class="rounded paper" font-size="58" font-weight="820">手机 Today &amp; Plans 两版候选</text>
  <text x="82" y="188" class="sf muted body">Watch 版本保持不变 · 语义 tokens 保持不变 · 仅比较 iPhone 信息顺序</text>
  <line x1="82" y1="228" x2="1718" y2="228" stroke="#3B3B43" stroke-width="2"/>


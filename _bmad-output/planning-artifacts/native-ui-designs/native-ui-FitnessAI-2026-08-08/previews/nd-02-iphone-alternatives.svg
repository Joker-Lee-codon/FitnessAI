  <g transform="translate(1362 358)">
    <text class="sf muted tiny" letter-spacing="3">WHAT CHANGES</text>
    <text y="54" class="rounded paper heading">同系统，不同顺序</text>
    <line y1="92" x2="350" y2="92" stroke="#3B3B43" stroke-width="2"/>
    <text y="142" class="sf red tiny" letter-spacing="2">方案 1</text>
    <text y="178" class="sf paper small" font-weight="650">计划内容是主角</text>
    <text y="212" class="sf muted tiny">完整动作顺序先出现；</text>
    <text y="242" class="sf muted tiny">Watch CTA 在阅读终点。</text>
    <line y1="286" x2="350" y2="286" stroke="#3B3B43" stroke-width="2"/>
    <text y="336" class="sf peri tiny" letter-spacing="2">方案 2</text>
    <text y="372" class="sf paper small" font-weight="650">今天能否开练是主角</text>
    <text y="406" class="sf muted tiny">Watch readiness 与 CTA 先出现；</text>
    <text y="436" class="sf muted tiny">动作顺序作为训练议程。</text>

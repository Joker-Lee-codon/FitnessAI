    <line x1="848" y1="1056" x2="1254" y2="1056" stroke="#3B3B43"/>
    <text x="912" y="1096" class="sf red" font-size="14" text-anchor="middle">今天</text><text x="1051" y="1096" class="sf muted" font-size="14" text-anchor="middle">历史</text><text x="1190" y="1096" class="sf muted" font-size="14" text-anchor="middle">分析</text>
    <rect x="979" y="1144" width="144" height="5" rx="3" fill="#F5F1E8"/>

<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="3100" viewBox="0 0 2560 3100" role="img" aria-labelledby="title desc">
  <title id="title">FitnessAI ND-03 Watch Core Expanded Review</title>
  <desc id="desc">Twenty-five Apple Watch page instances across Workout Entry, Active Session, Rest Resolution, Finish Review, and Watch Recovery.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".4"/></filter>
    <symbol id="watch" width="340" height="390" viewBox="0 0 340 390">
      <rect width="340" height="390" rx="88" fill="#454545"/>
      <rect x="14" y="14" width="312" height="362" rx="74" fill="#0B0B0D"/>
    </symbol>
    <style>
      .sf{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif}.round{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}

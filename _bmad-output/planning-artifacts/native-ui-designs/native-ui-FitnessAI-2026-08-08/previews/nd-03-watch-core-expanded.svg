  <g transform="translate(2050 810)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">AS-05 · WRITE FAILED</text><text x="28" y="78" class="title paper">本机保存失败</text><text x="28" y="112" class="micro bad">新一组尚不安全</text><line x1="28" y1="138" x2="312" y2="138" stroke="#3B3B43"/><text x="28" y="174" class="micro muted">上一持久化边界</text><text x="28" y="204" class="body paper">第 2 组 · 8 次 · 80 kg</text><text x="28" y="236" class="micro good">先前数据仍保留</text><rect x="28" y="284" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="317" text-anchor="middle" class="action">重试保存 →</text><text x="170" y="356" text-anchor="middle" class="secondary">打开恢复</text></g>


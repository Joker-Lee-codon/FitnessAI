  <rect width="2560" height="3100" fill="#0B0B0D"/>
  <text x="90" y="76" class="sf red" font-size="16" letter-spacing="3">FITNESSAI · ND-03 · WATCH CORE EXPANDED</text>
  <text x="90" y="142" class="round paper" font-size="58" font-weight="840">五个功能域 · 25 个页面实例</text>
  <text x="90" y="188" class="sf muted" font-size="22">沿用已确认的页面内容与状态契约，重新以 Kinetic Type 编排；页面实例不是新增导航目的地。</text>

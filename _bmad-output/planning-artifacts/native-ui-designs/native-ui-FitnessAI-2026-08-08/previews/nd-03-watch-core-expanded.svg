  <!-- WORKOUT ENTRY -->
  <text x="90" y="276" class="rowlabel">01 · WORKOUT ENTRY · 5 PAGES</text>
  <g transform="translate(130 300)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">WE-01 · 计划就绪</text><text x="28" y="78" class="title paper">上肢力量</text><text x="28" y="104" class="micro muted">计划 · 5 动作 · 18 组 · 68 分钟</text><line x1="28" y1="128" x2="312" y2="128" stroke="#3B3B43"/><text x="28" y="158" class="micro good">✓ 已缓存 · 可离线记录</text><text x="28" y="194" class="body paper">01 杠铃卧推　4 × 8</text><text x="28" y="222" class="body paper">02 上斜哑铃卧推　3 × 10</text><rect x="28" y="284" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="317" text-anchor="middle" class="action">开始训练 →</text></g>
  <g transform="translate(610 300)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">WE-02 · 无计划</text><text x="28" y="82" class="title paper">自由训练</text><text x="28" y="112" class="micro muted">手动优先 · Watch 保持记录权威</text><line x1="28" y1="138" x2="312" y2="138" stroke="#3B3B43"/><text x="28" y="174" class="micro good">✓ 可离线开始</text><text x="28" y="212" class="micro muted">最近动作</text><text x="28" y="240" class="body paper">杠铃卧推 · 80 kg</text><rect x="28" y="284" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="317" text-anchor="middle" class="action">开始自由训练 →</text></g>
  <g transform="translate(1090 300)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">WE-03 · 可恢复</text><text x="28" y="80" class="title paper">有一项训练未结束</text><text x="28" y="110" class="micro muted">上肢力量 · 已进行 42 分钟</text><line x1="28" y1="136" x2="312" y2="136" stroke="#3B3B43"/><text x="28" y="168" class="micro good">最近已保存</text><text x="28" y="198" class="body paper">杠铃卧推 · 第 3 组</text><text x="28" y="226" class="micro warn">1 个片段待确认</text><rect x="28" y="284" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="317" text-anchor="middle" class="action">继续训练 →</text></g>
  <g transform="translate(1570 300)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">WE-04 · 能力受限</text><text x="28" y="80" class="title paper">此动作仅支持手动</text><text x="28" y="112" class="micro warn">△ 当前 Watch 不支持该负重语义</text><line x1="28" y1="138" x2="312" y2="138" stroke="#3B3B43"/><text x="28" y="172" class="micro muted">次数与动作仍可记录</text><text x="28" y="202" class="body paper">负重字段将在 iPhone 补全</text><rect x="28" y="270" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="303" text-anchor="middle" class="action">使用手动记录</text><text x="170" y="344" text-anchor="middle" class="secondary">查看支持状态</text></g>
  <g transform="translate(2050 300)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">WE-05 · 开始失败</text><text x="28" y="80" class="title paper">无法开始训练</text><text x="28" y="112" class="micro bad">! 本机会话创建失败</text><line x1="28" y1="138" x2="312" y2="138" stroke="#3B3B43"/><text x="28" y="172" class="micro muted">上肢力量仍已缓存</text><text x="28" y="202" class="body paper">尚未进入 Active Session</text><text x="28" y="234" class="micro muted">请释放空间后重试</text><rect x="28" y="284" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="317" text-anchor="middle" class="action">重试开始 →</text></g>


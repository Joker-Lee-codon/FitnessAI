      .id{font:700 12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;letter-spacing:1.3px;fill:#8C8982}.micro{font:550 12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.body{font:600 16px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.title{font:780 25px ui-rounded,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.metric{font:850 54px ui-rounded,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.action{font:760 16px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#170604}.secondary{font:650 14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#A7AEFF}.rowlabel{font:760 18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;letter-spacing:2px;fill:#FF5B3F}

  <g transform="translate(1710 1320) scale(.94)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">RR-05 · MULTIPLE</text><text x="28" y="72" class="micro good">安全休息 · 01:18</text><text x="28" y="104" class="micro warn">3 项待处理</text><text x="28" y="142" class="title paper">先确认动作</text><text x="28" y="178" class="micro muted">次数与负重已保留</text><text x="28" y="208" class="micro muted">其余 2 项稍后继续</text><rect x="28" y="270" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="303" text-anchor="middle" class="action">处理这一项</text><text x="170" y="348" text-anchor="middle" class="secondary">全部稍后</text></g>
  <g transform="translate(2120 1320) scale(.94)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">RR-06 · HANDOFF</text><text x="28" y="72" class="micro good">安全休息 · 01:18</text><text x="28" y="104" class="micro warn">负重语义不支持</text><text x="28" y="140" class="title paper">需要在 iPhone 补全</text><text x="28" y="178" class="micro muted">已保留：杠铃卧推 · 8 次</text><text x="28" y="208" class="micro muted">目标：本次训练 / 第 3 组 / 负重</text><rect x="28" y="270" width="284" height="52" rx="17" fill="#FF5B3F"/><text x="170" y="303" text-anchor="middle" class="action">在 iPhone 检查</text><text x="170" y="348" text-anchor="middle" class="secondary">稍后</text></g>


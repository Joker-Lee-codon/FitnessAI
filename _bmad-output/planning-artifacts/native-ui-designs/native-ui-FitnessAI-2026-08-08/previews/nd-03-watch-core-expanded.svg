  <g transform="translate(610 810)" filter="url(#shadow)"><use href="#watch"/><text x="28" y="42" class="id">AS-02 · COMMITTING</text><text x="28" y="72" class="body paper">杠铃卧推 · 第 3 / 4 组</text><text x="36" y="152" class="metric paper">80<tspan font-size="18" fill="#FF5B3F"> kg</tspan></text><text x="38" y="190" class="body peri">8 次</text><text x="28" y="230" class="micro warn">◌ 正在保存本组…</text><rect x="28" y="284" width="284" height="52" rx="17" fill="#69676D"/><text x="170" y="317" text-anchor="middle" class="sf" font-size="16" font-weight="760" fill="#B8B4AC">正在提交</text></g>
